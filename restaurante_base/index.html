<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Axels</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="encabezado-principal">
    <h1>Restaurante Axels</h1>
    <p>Menu y reservas</p>
  </header>

  <!-- SECCION MENU -->
  <section class="seccion" id="seccion-menu">
    <h2>Menu del Restaurante</h2>

    <div id="filtros-menu">
      <button data-cat="Todos" class="btn-filtro activo">Todos</button>
      <button data-cat="Entrada" class="btn-filtro">Entradas</button>
      <button data-cat="Plato Fuerte" class="btn-filtro">Platos Fuertes</button>
      <button data-cat="Postre" class="btn-filtro">Postres</button>
    </div>

    <div id="contenedor-menu"></div>
  </section>

  <!-- SECCION RESERVAS -->
  <section class="seccion" id="seccion-reservas">
    <h2>Reservas</h2>

    <form id="form-reserva">
      <div class="campo">
        <label for="res-nombre">Nombre completo</label>
        <input type="text" id="res-nombre">
        <small class="error-campo" id="error-res-nombre"></small>
      </div>

      <div class="campo">
        <label for="res-correo">Correo electronico</label>
        <input type="email" id="res-correo">
        <small class="error-campo" id="error-res-correo"></small>
      </div>

      <div class="campo">
        <label for="res-fecha">Fecha de reserva</label>
        <input type="date" id="res-fecha">
        <small class="error-campo" id="error-res-fecha"></small>
      </div>

      <div class="campo">
        <label for="res-hora">Hora</label>
        <select id="res-hora">
          <option value="">Seleccione una hora</option>
          <option value="12:00">12:00</option>
          <option value="13:00">13:00</option>
          <option value="18:00">18:00</option>
          <option value="19:00">19:00</option>
          <option value="20:00">20:00</option>
        </select>
        <small class="error-campo" id="error-res-hora"></small>
      </div>

      <div class="campo">
        <label for="res-personas">Numero de personas</label>
        <input type="number" id="res-personas" min="1" max="20">
        <small class="error-campo" id="error-res-personas"></small>
      </div>

      <div class="campo">
        <label for="res-comentarios">Comentarios (opcional)</label>
        <textarea id="res-comentarios" rows="3"></textarea>
      </div>

      <button type="submit" id="btn-reserva" disabled>Agregar reserva</button>
    </form>

    <h3>Listado de reservas</h3>
    <table id="tabla-reservas">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Personas</th>
        </tr>
      </thead>
      <tbody id="tbody-reservas">
       
      </tbody>
    </table>

    <div class="resumen-reservas" id="resumen-reservas">
      
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
